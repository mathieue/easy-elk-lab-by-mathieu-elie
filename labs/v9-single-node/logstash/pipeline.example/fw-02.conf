# Logstash pipeline of the lab. Edit this file and save: Logstash reloads it
# by itself after a few seconds (follow it with: ./lab.sh logstash logs).
#
# fw-02, the firewall of the Lyon branch office, sends its FortiGate logs
# as syslog over UDP to this Logstash, on port 5514.

input {
  udp {
    port => 5514
  }
}

filter {
}

output {
  stdout {
    codec => rubydebug
  }
}
